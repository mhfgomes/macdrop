name: MacDrop
options:
  bundleIdPrefix: app.macdrop
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 26.0
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1
targets:
  MacDropCore:
    type: framework
    platform: macOS
    sources:
      - Sources/MacDropCore
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macdrop.MacDropCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  MacDrop:
    type: application
    platform: macOS
    sources:
      - Sources/MacDrop
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources
        buildPhase: resources
        excludes:
          - ExportOptions.plist
          - Info.plist
          - MacDrop.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: MacDrop
        CFBundleName: MacDrop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 MacDrop Contributors"
        MACDROP_RELEASES_URL: "$(MACDROP_RELEASES_URL)"
    dependencies:
      - target: MacDropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macdrop.MacDrop
        PRODUCT_NAME: MacDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/MacDrop.entitlements
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  MacDropCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacDropCoreTests
    resources:
      - fixtures
    dependencies:
      - target: MacDropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macdrop.MacDropCoreTests
        GENERATE_INFOPLIST_FILE: YES
  MacDropUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/MacDropUITests
    dependencies:
      - target: MacDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macdrop.MacDropUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacDrop:
    build:
      targets:
        MacDrop: all
        MacDropCore: all
    test:
      targets:
        - MacDropCoreTests
        - MacDropUITests
    archive:
      config: Release
